<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UITrackin Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="loginPage" class="page active">
            <div class="container">
                <div class="login-container">
                    <div class="logo-container text-center mb-4">
                        <i class="fas fa-qrcode fa-4x text-primary"></i>
                        <h2 class="mt-3">UITrackin Scanner</h2>
                        <p class="text-muted">Scan & Track Your Assets</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-building"></i> Department
                            </label>
                            <select class="form-select" id="department" required>
                                <option value="">Pilih Department...</option>
                            </select>
                        </div>
                        
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        
                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Scanner Page -->
        <div id="scannerPage" class="page">
            <!-- Navbar -->
            <nav class="navbar navbar-dark bg-primary">
                <div class="container-fluid">
                    <span class="navbar-brand">
                        <i class="fas fa-qrcode"></i> UITrackin Scanner
                    </span>
                    <div class="d-flex align-items-center text-white">
                        <span id="userName" class="me-3"></span>
                        <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Scanner Area -->
            <div class="container mt-3">
                <div class="scanner-section">
                    <div class="text-center mb-3">
                        <button class="btn btn-lg btn-primary" id="startScanBtn">
                            <i class="fas fa-camera"></i> Mulai Scan QR Code
                        </button>
                    </div>

                    <!-- Camera Preview -->
                    <div id="cameraPreview" class="d-none">
                        <div id="reader"></div>
                        <div class="text-center mt-2">
                            <button class="btn btn-danger" id="stopScanBtn">
                                <i class="fas fa-stop"></i> Stop Scan
                            </button>
                        </div>
                    </div>

                    <!-- Manual Input -->
                    <div class="card mt-3">
                        <div class="card-body">
                            <h6 class="card-title">Atau Masukkan Kode Manual</h6>
                            <div class="input-group">
                                <input type="text" class="form-control" id="manualCode" placeholder="Masukkan Asset Tag / ID">
                                <button class="btn btn-primary" id="manualScanBtn">
                                    <i class="fas fa-search"></i> Cari
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Asset Detail Page -->
        <div id="detailPage" class="page">
            <!-- Navbar -->
            <nav class="navbar navbar-dark bg-primary">
                <div class="container-fluid">
                    <button class="btn btn-outline-light btn-sm" id="backToScanner">
                        <i class="fas fa-arrow-left"></i> Kembali
                    </button>
                    <span class="navbar-brand mx-auto">Detail Asset</span>
                    <button class="btn btn-outline-light btn-sm" id="logoutBtn2">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </nav>

            <!-- Asset Details -->
            <div class="container mt-3">
                <div id="assetDetails" class="asset-details">
                    <!-- Will be populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
</body>
</html>
